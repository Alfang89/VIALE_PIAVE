<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartParking Viale Piave</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white pb-32">

    <!-- HEADER FISSO -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/50 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-tight text-white leading-tight">SmartParking 61</h1>
                <p id="connection-status" class="text-[10px] text-emerald-400 font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Sincronizzato
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span id="badge-liberi" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                -- Liberi
            </span>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE (TAB) -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4">

        <!-- TAB 1: HOME (Tachimetro & Statistiche) -->
        <div id="tab-home" class="space-y-6">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm text-center relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-2">Occupazione Totale</h2>
                
                <!-- Tachimetro SVG -->
                <div class="relative w-64 h-36 mx-auto flex items-end justify-center overflow-hidden mb-2">
                    <svg viewBox="0 0 200 110" class="w-full h-full">
                        <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round" />
                        <path id="tachometer-arc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#6366f1" stroke-width="16" stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2" class="transition-all duration-700 ease-out" />
                    </svg>
                    <div class="absolute bottom-2 text-center">
                        <span id="occupancy-count" class="text-4xl font-extrabold text-white tracking-tight">0</span>
                        <span class="text-slate-400 text-sm font-medium"> / 61</span>
                        <p id="occupancy-percent" class="text-xs text-indigo-400 font-semibold mt-0.5
